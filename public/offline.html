<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — FirmTrack</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f9fafb;
      color: #111827;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    p {
      color: #4b5563;
      font-size: 14px;
      margin: 0 0 20px;
    }
    button {
      background: #0855fd;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>Reconnect to the internet to keep using FirmTrack.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
